<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>FloodLens | ขอความช่วยเหลือ</title>
  <style>
    :root{color-scheme:dark;font:16px/1.6 Tahoma,system-ui,sans-serif;background:#071420;color:#dcebf7}
    *{box-sizing:border-box}main{max-width:680px;margin:auto;padding:24px}a{color:#60e4e4}
    section,form,article{background:#0d2132;border:1px solid #294256;border-radius:14px;padding:20px;margin:16px 0}
    label{display:block;margin-top:14px}input,select,textarea,button{font:inherit;color:inherit;background:#122d42;border:1px solid #3c5c73;border-radius:8px;padding:10px;width:100%}
    button{cursor:pointer;margin-top:12px;min-height:46px}button[type=submit]{background:#60e4e4;color:#071420;font-weight:bold}
    button:disabled{opacity:.55}.notice{background:#292a20;border-left:3px solid #dfbc69;padding:12px 16px}
    p{overflow-wrap:anywhere}textarea{resize:vertical}
  </style>
</head>
<body><main>
  <a href="/">← กลับหน้าหลัก</a>
  <h1>ขอความช่วยเหลือ</h1>
  <p id="availability" class="notice">ยังไม่มีการยืนยันทีมและเวลาเฝ้าคิว หากอยู่ในอันตราย ให้ติดต่อหน่วยช่วยเหลือโดยตรง</p>
  <form id="helpForm">
    <label for="need">ต้องการความช่วยเหลืออะไร</label>
    <select id="need" required>
      <option value="">เลือกความช่วยเหลือ</option><option value="evacuation">ออกจากพื้นที่</option>
      <option value="supplies">อาหาร น้ำ หรือของจำเป็น</option><option value="medical">ความช่วยเหลือทางการแพทย์</option>
      <option value="other">อื่น ๆ</option>
    </select>
    <label for="people">จำนวนคน</label><input id="people" type="number" min="1" max="10000" step="1" required>
    <label for="landmark">จุดสังเกต</label><input id="landmark" maxlength="200" placeholder="เช่น หน้าหอพัก ฝั่งประตูทางเข้า" required>
    <label for="details">รายละเอียดเพิ่มเติม (ไม่บังคับ)</label><textarea id="details" maxlength="2000" rows="3"></textarea>
    <label for="contact">ช่องทางติดต่อกลับ (ไม่บังคับ)</label><input id="contact" maxlength="200" autocomplete="off" placeholder="เบอร์โทรหรือช่องทางที่ติดต่อได้">
    <button id="locate" type="button">แนบพิกัดปัจจุบัน (ไม่บังคับ)</button>
    <p id="geoStatus" role="status">ยังไม่ได้แนบพิกัด</p>
    <button id="clearLocation" type="button" hidden>ลบพิกัด</button>
    <p>ข้อมูลในแบบฟอร์มนี้ใช้สำหรับทีมรับเรื่องและไม่แสดงในรายการสาธารณะ</p>
    <button id="submit" type="submit">ส่งคำขอ</button>
  </form>
  <p id="status" role="status"></p>
</main><script src="/help.js"></script></body></html>
