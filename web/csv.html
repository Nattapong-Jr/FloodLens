<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FloodLens | วิเคราะห์ข้อมูล CSV</title>
<style>
:root{color-scheme:dark;font-family:Tahoma,system-ui,sans-serif;color:#dbeafe;background:#081523}body{margin:0}main{max-width:1120px;margin:auto;padding:24px}a{color:#67e8f9}p{line-height:1.7;color:#abc1d5}section{background:#102337;border:1px solid #29455c;border-radius:12px;padding:16px}button{font:inherit;padding:10px 14px;border:1px solid #52748b;border-radius:8px;background:#183149;color:white;cursor:pointer}button:disabled{opacity:.55;cursor:default}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px;border-bottom:1px solid #29455c}
</style></head>
<body><main>
<a href="/">← กลับหน้าติดตามน้ำและฝน</a>
<h1>วิเคราะห์ข้อมูล CSV</h1>
<p id="selection" role="status"></p>
<section aria-labelledby="heading">
<h2 id="heading">ข้อมูลสถานีที่เลือกจากหน้าหลัก</h2>
<p id="status"></p><p id="summary"></p>
<button id="export" disabled>ดาวน์โหลดชุดนี้เป็น CSV</button>
<div class="scroll"><table><thead><tr><th>สถานี</th><th>ระยะจาก KMITL</th><th id="valueHeading">ค่าที่วัด</th><th>เวลาที่วัด</th><th>แหล่งข้อมูล</th><th>สถานะข้อมูล</th></tr></thead><tbody id="records"></tbody></table></div>
</section></main>
<script>
'use strict';
const el = id => document.getElementById(id);
const formatTime = value => value ? new Date(value).toLocaleString('th-TH', {timeZone:'Asia/Bangkok'}) : 'ไม่ทราบ';
let selection;
try {
  selection = JSON.parse(sessionStorage.getItem('floodlens.csv.selection'));
} catch {
  selection = null;
}
if (Array.isArray(selection?.rows)) {
  const {rows, label, unit, scope, search, fresh, status, capturedAt} = selection;
  const area = scope === 'local' ? 'รอบ KMITL 10 กม.' : 'พื้นที่รอบกรุงเทพฯ 150 กม.';
  el('selection').textContent = [label, area, search ? 'ค้นหา: '+search : '', fresh ? 'ซ่อนข้อมูลเก่า' : 'รวมข้อมูลเก่า'].filter(Boolean).join(' · ');
  el('status').textContent = 'ชุดข้อมูลจากหน้าหลัก ณ '+formatTime(capturedAt)+' · '+status;
  el('valueHeading').textContent = label+' ('+unit+')';
  const values = rows.map(row => row.value).filter(Number.isFinite);
  const average = values.length ? (values.reduce((sum, value) => sum+value, 0)/values.length).toFixed(2) : null;
  el('summary').textContent = rows.length ? rows.length+' รายการ'+(average === null ? '' : ' · ค่าเฉลี่ยของค่าที่แสดง '+average+' '+unit) : 'ไม่มีข้อมูลสถานีในชุดที่เลือก';
  for (const row of rows) {
    const tr = el('records').insertRow();
    for (const value of [row.name || row.station_id, row.distance_km+' กม.', Number.isFinite(row.value) ? row.value.toFixed(2) : null, formatTime(row.timestamp), row.source, row.stale ? 'ข้อมูลเก่า / ไม่ทราบเวลา' : 'ข้อมูลล่าสุด']) {
      tr.insertCell().textContent = value ?? 'ไม่ทราบ';
    }
  }
  el('export').disabled = !rows.length;
  el('export').onclick = () => {
    const fields = ['timestamp','station_id','name','distance_km','value','unit','source','stale'];
    const quote = value => {
      const safe = typeof value === 'string' ? value.replace(/^(?:[\t\r\n]|\s*[=+@-])/, "'$&") : value;
      return '"'+String(safe ?? '').replaceAll('"','""')+'"';
    };
    const lines = rows.map(row => fields.map(field => quote(field === 'unit' ? unit : row[field])).join(','));
    const blob = new Blob(['\ufeff'+[fields.join(','), ...lines].join('\r\n')], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'floodlens-selected-stations.csv';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
} else {
  el('selection').textContent = 'เลือกประเภทข้อมูลและตัวกรองที่หน้าหลัก แล้วกดวิเคราะห์ข้อมูล CSV เพื่อเปิดชุดที่กำลังดู';
}
</script></body></html>
